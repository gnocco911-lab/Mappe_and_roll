# Configurazione per creare l'eseguibile (electron-builder).
appId: it.dnd.battlemap
productName: Mappe di Battaglia D&D
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
publish: null
win:
  target:
    - target: nsis      # installatore
    - target: portable  # eseguibile singolo, senza installazione
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  language: "1040"      # italiano
mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch: [universal]   # un solo file che funziona sia sui Mac Intel sia su quelli con chip Apple (M1, M2…)
  artifactName: ${productName}-${version}-mac.${ext}
  minimumSystemVersion: "11.0"
  identity: null        # nessuna firma a pagamento: al primo avvio serve "Apri" dal menu contestuale
linux:
  target: [AppImage]
